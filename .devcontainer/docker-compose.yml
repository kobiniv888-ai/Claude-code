services:
  app:
    image: mcr.microsoft.com/devcontainers/typescript-node:1-22-bookworm
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity
    # Share the database container's network, so Postgres is reachable on localhost:5432.
    network_mode: service:db

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: bayit
      POSTGRES_PASSWORD: bayit
      POSTGRES_DB: bayit
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
