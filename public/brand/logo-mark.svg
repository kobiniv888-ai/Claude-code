<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>Bayit</title>
  <!-- Bayit mark: a terracotta roof over an open, arched doorway. Replace this file to rebrand
       (then run `node scripts/generate-icons.mjs`). Keep the "glyph" group: the app icons reuse it. -->
  <defs>
    <linearGradient id="bayit-tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#25487F"/>
      <stop offset="1" stop-color="#1A345F"/>
    </linearGradient>
  </defs>
  <rect id="tile" width="64" height="64" rx="16" fill="url(#bayit-tile)"/>
  <g id="glyph">
    <path d="M13 31 32 15l19 16" fill="none" stroke="#E5805F" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path fill="#FFFFFF" d="M23.5 48.5V36.5a8.5 8.5 0 0 1 17 0v12a1.5 1.5 0 0 1-1.5 1.5H25a1.5 1.5 0 0 1-1.5-1.5Z"/>
  </g>
</svg>
