# Scans the whole git history for committed keys on every push and pull request.
# No third-party actions: gitleaks is built from its Go module at an exact version,
# which Go checks against the public checksum database (sum.golang.org).
name: Secret scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: v8.30.1
    steps:
      - name: Check out the full history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init -q .
          git config --local http.https://github.com/.extraheader \
            "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          git fetch -q --no-tags origin "$GITHUB_SHA"
          git checkout -q --detach "$GITHUB_SHA"
          git config --local --unset-all http.https://github.com/.extraheader

      - name: Install gitleaks
        run: GOBIN="$RUNNER_TEMP/bin" go install "github.com/zricethezav/gitleaks/v8@${GITLEAKS_VERSION}"

      - name: Scan every commit on every branch
        run: |
          "$RUNNER_TEMP/bin/gitleaks" git --log-opts="--all" --redact --no-banner --exit-code 1 .
