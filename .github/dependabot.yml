# Dependabot (SECURITY_REPORT 2.3.d, 2.3.f): weekly npm update pull requests.
# Security updates are grouped into one pull request; turn on "Dependabot alerts" and "Dependabot
# security updates" in the repository settings (Settings → Code security) for those to open.
# The cooldown keeps routine version updates at least 14 days old (supply-chain rule 2.3.f);
# security updates are not delayed by it. Every update still goes through `npm ci` and review:
# install scripts stay off (.npmrc) and tests/unit/install-scripts.test.ts flags a new one.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Jerusalem"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 14
    groups:
      security-updates:
        applies-to: security-updates
        patterns: ["*"]
      framework:
        applies-to: version-updates
        patterns: ["next", "eslint-config-next", "react", "react-dom", "@types/react", "@types/react-dom"]
      prisma:
        applies-to: version-updates
        patterns: ["prisma", "@prisma/*"]
    commit-message:
      prefix: "deps"
